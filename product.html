<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">Product — Velvet FINDS</title>
  <meta name="description" content="Curated product review with honest details and affiliate buying options — Velvet FINDS.">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="shimmer.css">
  <script src="ga4.js" defer></script>
  <style>
    .related-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; }
    @media (max-width:760px) { .related-grid { grid-template-columns:repeat(2,1fr); } }
    .back-btn {
      display:inline-flex; align-items:center; gap:8px;
      font-size:14px; font-weight:700; color:rgba(255,255,255,0.85);
      padding:10px 0; transition:color .2s;
      position:relative; z-index:3;
    }
    .back-btn:hover { color:#fff; }
    .sticky-buy { position:sticky; top:90px; }
    .review-chip {
      display:inline-flex; align-items:center; gap:7px;
      padding:9px 16px; border-radius:10px;
      border:1px solid var(--line); background:var(--bg-card); font-size:13.5px;
    }
    .store-logo { font-size:12px; font-weight:800; padding:4px 10px; border-radius:6px; }
    .store-amazon { background:#FF9900; color:#fff; }
    .store-flipkart { background:#2874F0; color:#fff; }
    .store-myntra { background:#FF3F6C; color:#fff; }
    .store-general { background:var(--plum-800); color:#fbf6ef; }
    .big-rating {
      display:flex; align-items:center; gap:16px;
      padding:18px 20px; background:var(--gold-100);
      border-radius:var(--r-md); border:1px solid var(--gold-300); margin:20px 0;
    }
    .big-rating .score { font-family:var(--font-serif); font-size:44px; font-weight:600; color:var(--plum-800); line-height:1; }
    .rating-bars { flex:1; }
    .rbar-row { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--ink-soft); margin-bottom:5px; }
    .rbar-track { flex:1; height:6px; background:rgba(201,161,90,.2); border-radius:999px; overflow:hidden; }
    .rbar-fill { height:100%; background:var(--gold-500); border-radius:999px; }
    .notfound { text-align:center; padding:120px 24px; }
    .notfound h2 { font-family:var(--font-serif); font-size:32px; margin-bottom:14px; }
    .notfound p { color:var(--ink-soft); margin-bottom:28px; }
    @media (max-width:900px) { .sticky-buy { position:static; } }
    /* Fade-in entrance for product content */
    @keyframes vfFadeUp {
      from { opacity:0; transform:translateY(24px); }
      to { opacity:1; transform:translateY(0); }
    }
    .vf-fade-up { animation: vfFadeUp 0.55s cubic-bezier(0.25,0.46,0.45,0.94) both; }
    .vf-fade-up-2 { animation: vfFadeUp 0.65s 0.1s cubic-bezier(0.25,0.46,0.45,0.94) both; }
    .vf-fade-up-3 { animation: vfFadeUp 0.75s 0.2s cubic-bezier(0.25,0.46,0.45,0.94) both; }
  </style>
</head>
<body>

<!-- ====== NAV (consistent across all pages) ====== -->
<header class="site">
  <div class="wrap nav-row">
    <a href="index.html" class="logo">
      <div class="logo-img-wrap">
        <img id="siteLogoNav" src="velvet-finds-logo.jpeg" alt="Velvet FINDS" width="42" height="42">
      </div>
      <span id="siteNameNav" style="font-family:var(--font-serif); font-weight:600;">Velvet FINDS</span>
    </a>
    <nav class="links">
      <a href="index.html#shop">Shop</a>
      <a href="index.html#categories">Categories</a>
      <a href="blog.html">Blog</a>
      <a href="index.html#editors">Editor's Picks</a>
      <a href="index.html#about">About</a>
    </nav>
    <div class="nav-actions">
      <a href="index.html" class="icon-btn" title="Go home">🏠</a>
      <a href="#" class="pin-btn" id="navPinBtn" target="_blank">📌 Follow on Pinterest</a>
    </div>
  </div>
</header>

<!-- ====== HERO BACKGROUND — filled by JS ====== -->
<div id="productHeroBg" style="display:none;">
  <!-- JS renders immersive hero here -->
</div>

<!-- ====== MAIN CONTENT — loaded by JS ====== -->
<main id="productWrap" style="padding:40px 0;"></main>

<!-- ====== RELATED SECTION ====== -->
<section id="relatedSection" style="padding:60px 0; border-top:1px solid var(--line); display:none;">
  <div class="wrap">
    <div class="sec-head" style="margin-bottom:24px;">
      <div><span class="eyebrow-sm">You might also like</span><h2>More Curated Finds</h2></div>
      <a href="index.html" class="see-all">See all →</a>
    </div>
    <div class="related-grid" id="relatedGrid"></div>
  </div>
</section>

<!-- ====== FOOTER ====== -->
<footer>
  <div class="wrap">
    <div class="foot-bottom" style="padding-top:24px;">
      <span style="font-size:12.5px; color:var(--ink-soft);">© 2026 Velvet FINDS. As an Amazon Associate I earn from qualifying purchases. <a href="admin.html" style="color:var(--gold-500); margin-left:8px; font-weight:700;">⚙ Admin</a></span>
      <div class="foot-social">
        <a href="#" title="Pinterest" id="footPinBtn" target="_blank" rel="nofollow sponsored noopener">📌</a>
        <a href="#" title="Instagram" id="footInstaBtn" target="_blank" rel="nofollow sponsored noopener">📷</a>
        <a href="#" title="Email">✉</a>
      </div>
    </div>
  </div>
</footer>

<script src="data.js"></script>
<script src="mascot.js"></script>
<script>
  // ── Init ──────────────────────────────────────────────
  VF.init();
  VF.recordVisit();

  // Apply site settings (logo, name, social links)
  const s = VF.getSettings();
  if (s.siteName) {
    const el = document.getElementById('siteNameNav');
    if (el) el.textContent = s.siteName;
  }
  if (s.logo) {
    const el = document.getElementById('siteLogoNav');
    if (el) { el.src = s.logo; }
  }
  if (s.pinterestUrl) {
    const np = document.getElementById('navPinBtn');
    const fp = document.getElementById('footPinBtn');
    if (np) np.href = s.pinterestUrl;
    if (fp) fp.href = s.pinterestUrl;
  }
  if (s.instagramUrl) {
    const fi = document.getElementById('footInstaBtn');
    if (fi) fi.href = s.instagramUrl;
  }

  // ── Category → mascot image map ─────────────────────
  const CATEGORY_MASCOT = {
    'Home Decor':     'images/mascot/hamster_peanut.jpg',
    'Bedroom':        'images/mascot/hamster_heart_paws.jpg',
    'Living Room':    'images/mascot/hamster_peanut.jpg',
    'Kitchen':        'images/mascot/hamster_heart_hands.jpg',
    'Bathroom':       'images/mascot/hamster_balloons.jpg',
    'Beauty':         'images/mascot/hamster_pink_heart.jpg',
    'Fitness':        'images/mascot/hamster_fitness.jpg',
    'Gifts':          'images/mascot/hamster_heart2.jpg',
    'Tech Gadgets':   'images/mascot/hamster_fitness.jpg',
    'Travel':         'images/mascot/hamster_balloons2.jpg',
    'Apartment Decor':'images/mascot/hamster_peanut2.jpg',
    'default':        'images/mascot/hamster_pink_heart.jpg'
  };

  function getMascotForCategory(cat) {
    return CATEGORY_MASCOT[cat] || CATEGORY_MASCOT['default'];
  }

  // ── Load & Render ────────────────────────────────────
  const params  = new URLSearchParams(window.location.search);
  const id      = params.get('id');
  const wrap    = document.getElementById('productWrap');
  const heroBg  = document.getElementById('productHeroBg');

  // Loading state
  wrap.innerHTML = `
    <div class="wrap" style="text-align:center;padding:80px 20px;">
      <div class="spinner" style="margin:0 auto 20px;"></div>
      <p style="color:var(--ink-soft);">Loading product…</p>
    </div>`;

  (async () => {
    try {
      const product = id ? await VF.getProduct(id) : null;

      if (!product) {
        wrap.innerHTML = `
          <div class="wrap notfound">
            <div style="font-size:64px;margin-bottom:16px;">🐹</div>
            <h2>Product not found</h2>
            <p>This find may have been removed or is currently unavailable. Explore more curated picks below!</p>
            <a href="index.html" class="btn-gold" style="margin-top:16px;display:inline-flex;">← Back to Feed</a>
          </div>`;
        return;
      }

      // Update page title + meta
      document.getElementById('pageTitle').textContent = `${product.name} — Velvet FINDS`;

      const storeClass  = { Amazon:'store-amazon', Flipkart:'store-flipkart', Myntra:'store-myntra' }[product.store] || 'store-general';
      const buyBtnClass = { Amazon:'buy-amazon', Flipkart:'buy-flipkart', Myntra:'buy-flipkart' }[product.store] || 'buy-general';
      const buyIcon     = { Amazon:'🛒', Flipkart:'🛍️', Myntra:'👗' }[product.store] || '🛒';
      const disc        = product.originalPrice ? Math.round((1 - product.price / product.originalPrice) * 100) : 0;
      const mascotSrc   = getMascotForCategory(product.category);

      // ── IMMERSIVE HERO BACKGROUND ──────────────────────
      heroBg.style.display = 'block';

      if (product.image) {
        heroBg.innerHTML = `
          <div class="product-hero-bg">
            <img
              class="product-hero-bg-img"
              src="${product.image}"
              alt="${product.name}"
              loading="eager"
              decoding="async"
            >
            <div class="product-hero-content">
              <a href="index.html" class="back-btn">← Back to all finds</a>
              <div style="flex:1;"></div>
              <div class="product-hero-mascot-badge vf-fade-up">
                <img src="${mascotSrc}" alt="Velvet mascot">
              </div>
              <div class="product-hero-cat vf-fade-up">${product.category}</div>
              <h1 class="product-hero-name vf-fade-up-2">${product.name}</h1>
              <div class="product-hero-price-chip vf-fade-up-3">
                ${product.originalPrice ? `<span class="was-price">₹${product.originalPrice.toLocaleString()}</span>` : ''}
                ₹${product.price.toLocaleString()}
                ${disc >= 10 ? `<span class="disc-tag">🔥 ${disc}% off</span>` : ''}
              </div>
            </div>
          </div>`;
      } else {
        // No image — elegant gradient fallback
        heroBg.innerHTML = `
          <div class="product-hero-bg no-image" style="background:${product.gradient || 'var(--gold-grad)'};">
            <div class="product-hero-content">
              <a href="index.html" class="back-btn">← Back to all finds</a>
              <div style="flex:1;"></div>
              <div class="product-hero-mascot-badge vf-fade-up">
                <img src="${mascotSrc}" alt="Velvet mascot">
              </div>
              <div class="product-hero-cat vf-fade-up">${product.category}</div>
              <h1 class="product-hero-name vf-fade-up-2">${product.name}</h1>
              <div class="product-hero-price-chip vf-fade-up-3">
                ${product.originalPrice ? `<span class="was-price">₹${product.originalPrice.toLocaleString()}</span>` : ''}
                ₹${product.price.toLocaleString()}
                ${disc >= 10 ? `<span class="disc-tag">🔥 ${disc}% off</span>` : ''}
              </div>
            </div>
          </div>`;
      }

      // ── PRODUCT DETAIL BELOW HERO ──────────────────────
      wrap.style.padding = '0';
      wrap.innerHTML = `
        <div class="product-below-hero">

          <!-- LEFT: thumbnail + social proof -->
          <div>
            <div class="product-thumb-card">
              ${product.image
                ? `<img src="${product.image}" alt="${product.name}" loading="lazy">`
                : `<div style="width:100%;height:100%;background:${product.gradient || 'var(--gold-grad)'};display:flex;align-items:center;justify-content:center;">
                     <div style="text-align:center;padding:32px;">
                       <div style="font-size:72px;margin-bottom:16px;">✨</div>
                       <div style="font-family:var(--font-serif);font-size:20px;color:#fff;opacity:.9;">${product.name}</div>
                     </div>
                   </div>`
              }
            </div>
            <!-- Social proof chips -->
            <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:16px;">
              <span class="review-chip">📌 ${product.savedCount || '—'} saves</span>
              <span class="review-chip">⭐ ${product.rating} rating</span>
              <span class="review-chip">💬 ${product.reviews ? product.reviews.toLocaleString() : 0} reviews</span>
              <span class="store-logo ${storeClass}">${product.store || 'Buy'}</span>
            </div>
          </div>

          <!-- RIGHT: info + buy button -->
          <div class="sticky-buy">
            <div class="product-info">

              <!-- Breadcrumb -->
              <div class="breadcrumb">
                <a href="index.html">Home</a><span>›</span>
                <a href="index.html#categories">${product.category}</a><span>›</span>
                <span>${product.name}</span>
              </div>

              <div class="category">${product.category}</div>
              <h1>${product.name}</h1>

              <div class="product-badges">
                ${product.badge ? `<span class="badge badge-plum">${product.badge}</span>` : ''}
                ${disc >= 20 ? `<span class="badge badge-red">🔥 ${disc}% off</span>` : ''}
                <span class="badge badge-gold">✓ Velvet Verified</span>
              </div>

              <div class="product-price">
                ${product.originalPrice ? `<span class="was">₹${product.originalPrice.toLocaleString()}</span>` : ''}
                ₹${product.price.toLocaleString()}
                ${disc ? `<span class="save-tag">Save ₹${(product.originalPrice - product.price).toLocaleString()}</span>` : ''}
              </div>

              <div class="product-rating">
                <span class="stars-lg">${'★'.repeat(5)}</span>
                <span style="font-weight:800;">${product.rating}</span>
                <span class="review-count">(${product.reviews ? product.reviews.toLocaleString() : 0} reviews)</span>
              </div>

              <div class="product-desc">${product.description || ''}</div>

              <ul class="feature-list">
                ${(product.features || []).map(f => `<li>${f}</li>`).join('')}
              </ul>

              <!-- BUY BUTTON -->
              <a href="${product.affiliateLink}" target="_blank" rel="nofollow sponsored noopener"
                 class="buy-btn ${buyBtnClass}"
                 onclick="VF.recordProductClick('${product.id}');"
                 id="mainBuyBtn">
                ${buyIcon} Buy on ${product.store || 'Amazon'} — ₹${product.price.toLocaleString()}
              </a>

              <div style="text-align:center; font-size:12px; color:var(--ink-soft); margin-top:10px; margin-bottom:16px;">
                ⚡ Best price verified · Free delivery available<br>
                <span style="opacity:0.75; font-style:italic;">As an Amazon Associate I earn from qualifying purchases.</span>
              </div>

              <!-- Ratings breakdown -->
              <div class="big-rating">
                <div>
                  <div class="score">${product.rating}</div>
                  <div style="color:var(--gold-500); font-size:16px; letter-spacing:3px; margin-top:6px;">${'★'.repeat(5)}</div>
                  <div style="font-size:12px; color:var(--ink-soft); margin-top:4px;">${product.reviews ? product.reviews.toLocaleString() : 0} reviews</div>
                </div>
                <div class="rating-bars">
                  ${[[5,78],[4,14],[3,5],[2,2],[1,1]].map(([st, pct]) => `
                    <div class="rbar-row">
                      <span>${st}★</span>
                      <div class="rbar-track"><div class="rbar-fill" style="width:${pct}%"></div></div>
                      <span>${pct}%</span>
                    </div>`).join('')}
                </div>
              </div>

              <!-- Share Row -->
              <div class="share-row">
                <span>Share:</span>
                <a href="https://pinterest.com/pin/create/button/?url=${encodeURIComponent(window.location.href)}&description=${encodeURIComponent(product.name)}" target="_blank" class="share-btn">📌 Pinterest</a>
                <button class="share-btn" onclick="navigator.clipboard.writeText(window.location.href); this.textContent='Copied ✓'">🔗 Copy Link</button>
              </div>

            </div>
          </div>

        </div>`;

      // ── Related Products ──────────────────────────────
      const allProducts = await VF.getProducts();
      const related = allProducts
        .filter(p => p.id !== product.id && p.category === product.category)
        .slice(0, 4);

      if (related.length) {
        document.getElementById('relatedSection').style.display = 'block';
        document.getElementById('relatedGrid').innerHTML = related.map(p => `
          <div class="pin-card" style="cursor:pointer;"
               onclick="VF.recordProductClick('${p.id}'); window.location.href='product.html?id=${p.id}'">
            <div class="pin-media" style="${p.image
              ? `background-image:url('${p.image}');background-size:cover;background-position:center;`
              : `background:${p.gradient};`} height:200px;">
              <span class="save-btn">📌 Save</span>
            </div>
            <div class="pin-body">
              <div class="pin-cat">${p.category}</div>
              <div class="pin-title">${p.name}</div>
              <div class="pin-meta">
                <span class="stars">★★★★★ <span style="color:var(--ink-soft);font-weight:600;">${p.rating}</span></span>
                <span class="price">₹${p.price.toLocaleString()}</span>
              </div>
            </div>
          </div>`).join('');
      }

    } catch (err) {
      console.error('[VF] Error rendering product page:', err);
      wrap.innerHTML = `
        <div class="wrap notfound">
          <div style="font-size:64px;margin-bottom:16px;">⚠️</div>
          <h2>Unable to load product</h2>
          <p>Please check your connection and try again.</p>
          <a href="index.html" class="btn-gold" style="margin-top:16px;display:inline-flex;">← Back to Feed</a>
        </div>`;
    }
  })();
</script>
</body>
</html>
