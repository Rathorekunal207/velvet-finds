<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Article | Velvet FINDS</title>
  <meta name="description" content="Read article on Velvet FINDS">
  <meta id="ogTitle" property="og:title" content="Article | Velvet FINDS">
  <meta id="ogDesc" property="og:description" content="Read article on Velvet FINDS">
  <meta id="ogImage" property="og:image" content="">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,450;9..144,800&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="shimmer.css">
  <script src="ga4.js"></script>
  <style>
    /* CSS Grid */
    .blog-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 28px;
    }
    @media (max-width: 800px) {
      .blog-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 540px) {
      .blog-grid { grid-template-columns: 1fr; }
    }

    /* Blog Card styles for related articles */
    .blog-card {
      overflow: hidden;
      border-radius: var(--r-lg, 16px);
      background: var(--bg-card);
      border: 1px solid var(--line);
      transition: transform .28s, box-shadow .28s;
      cursor: pointer;
    }
    .blog-card:hover {
      transform: translateY(-6px);
      box-shadow: var(--sh-card, 0 12px 24px rgba(43,23,48,0.08));
    }
    .blog-card-img-wrap {
      position: relative;
      overflow: hidden;
      aspect-ratio: 16/9;
    }
    .blog-card-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .45s;
    }
    .blog-card:hover .blog-card-img-wrap img {
      transform: scale(1.05);
    }
    .blog-cat-badge {
      position: absolute;
      top: 14px;
      left: 14px;
      background: var(--gold-grad);
      color: var(--plum-900);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 5px 12px;
      border-radius: 999px;
    }
    .blog-card-body { padding: 20px; }
    .blog-card-title {
      font-family: var(--font-serif);
      font-size: 18px;
      font-weight: 450;
      line-height: 1.3;
      margin-bottom: 10px;
      color: var(--ink);
    }
    .blog-card-excerpt {
      font-size: 13.5px;
      color: var(--ink-soft);
      line-height: 1.65;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      overflow: hidden;
      margin-bottom: 14px;
    }
    .blog-card-meta {
      display: flex;
      gap: 14px;
      font-size: 12px;
      color: var(--ink-soft);
      flex-wrap: wrap;
      margin-bottom: 16px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }
    .blog-read-more {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--gold-500);
      font-weight: 800;
      font-size: 13px;
      transition: color .2s;
    }
    .blog-card:hover .blog-read-more { color: var(--plum-900); }
    
    .blog-skeleton {
      height: 400px;
      border-radius: var(--r-lg, 16px);
      background: linear-gradient(90deg,#f0ebe6 25%,#e8e0d8 50%,#f0ebe6 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
    }
    
    /* Article Styles */
    .article-body h2 {
      font-family: var(--font-serif);
      font-weight: 450;
      font-size: 26px;
      margin: 44px 0 16px;
      color: var(--ink);
      padding-left: 18px;
      border-left: 4px solid var(--gold-500);
      line-height: 1.3;
    }
    .article-body h3 {
      font-family: var(--font-serif);
      font-size: 20px;
      font-weight: 450;
      margin: 32px 0 12px;
      color: var(--ink);
    }
    .article-body p {
      font-size: 16px;
      line-height: 1.9;
      color: var(--ink);
      margin-bottom: 20px;
    }
    .article-body blockquote.pull-quote, .article-body .pull-quote {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 20px;
      line-height: 1.6;
      color: var(--plum-900);
      background: var(--gold-100);
      border-left: 5px solid var(--gold-500);
      padding: 24px 28px;
      border-radius: 0 12px 12px 0;
      margin: 32px 0;
    }
    .article-body .article-tip {
      background: #f0faf4;
      border-left: 4px solid var(--green, #28a745);
      padding: 18px 22px;
      border-radius: 0 12px 12px 0;
      margin: 24px 0;
      font-size: 15px;
      line-height: 1.7;
    }
    .article-body ul, .article-body ol {
      padding-left: 24px;
      margin-bottom: 20px;
    }
    .article-body li {
      margin-bottom: 8px;
      font-size: 15.5px;
      line-height: 1.7;
    }
    .article-body img {
      width: 100%;
      border-radius: 12px;
      margin: 24px 0;
    }
    .article-layout {
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 60px;
      align-items: flex-start;
      padding: 40px 0 80px;
    }
    @media (max-width: 900px) {
      .article-layout { grid-template-columns: 1fr; }
      .article-toc { display: none; }
    }
    .article-toc {
      position: sticky;
      top: 100px;
    }
    .toc-box {
      background: var(--bg-card);
      border: 1px solid var(--line);
      border-radius: var(--r-lg, 16px);
      padding: 24px;
    }
    .toc-title {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--gold-500);
      margin-bottom: 16px;
    }
    .toc-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .toc-link {
      font-size: 13.5px;
      color: var(--ink-soft);
      font-weight: 600;
      padding: 7px 12px;
      border-radius: 8px;
      display: block;
      transition: all .2s;
      line-height: 1.4;
      text-decoration: none;
    }
    .toc-link:hover, .toc-link.toc-active {
      color: var(--plum-900);
      background: var(--gold-100, #fcfaf5);
    }
    .rec-products-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }
    @media (max-width: 900px) { .rec-products-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 500px) { .rec-products-grid { grid-template-columns: 1fr; } }
    .rec-product-card {
      background: var(--bg-card);
      border: 1px solid var(--line);
      border-radius: var(--r-md, 12px);
      overflow: hidden;
      transition: transform .25s, box-shadow .25s;
      cursor: pointer;
    }
    .rec-product-card:hover { transform: translateY(-4px); box-shadow: var(--sh-card, 0 12px 24px rgba(43,23,48,0.08)); }
    .rec-product-img {
      height: 160px;
      background: var(--gold-100, #fcfaf5);
    }
    .rec-product-body { padding: 14px; }
    
    .spinner {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2.5px solid var(--line);
      border-top-color: var(--gold-500);
      animation: spin .85s linear infinite;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
<header class="site">
  <div class="wrap nav-row">
    <a href="index.html" class="logo">
      <div class="logo-img-wrap">
        <img id="siteLogoNav" src="velvet-finds-logo.jpeg" alt="Velvet FINDS" width="42" height="42">
      </div>
      <span id="siteNameNav" style="font-family:var(--font-serif); font-weight:600;">Velvet FINDS</span>
    </a>
    <nav class="links">
      <a href="index.html#shop">Shop</a>
      <a href="index.html#categories">Categories</a>
      <a href="blog.html" style="color:var(--gold-500);">Blog</a>
      <a href="index.html#editors">Editor's Picks</a>
      <a href="index.html#about">About</a>
    </nav>
    <div class="nav-actions">
      <a href="index.html" class="icon-btn" title="Go home">🏠</a>
      <a href="#" class="pin-btn" id="navPinBtn" target="_blank">📌 Follow on Pinterest</a>
    </div>
  </div>
</header>

  <div id="articleWrap">
    <div style="text-align:center;padding:100px 20px;">
      <div class="spinner" style="margin:0 auto 20px;"></div>
      <p style="color:var(--ink-soft);">Loading article…</p>
    </div>
  </div>

  <footer style="background:var(--plum-900); color:#fff; padding:60px 0 20px;">
    <div class="wrap">
      <div class="foot-grid" style="display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:40px; margin-bottom:40px;">
        <div>
          <div class="logo" style="font-family:var(--font-serif); font-size:24px; font-weight:800; margin-bottom:16px;">Velvet FINDS</div>
          <p style="color:var(--ink-soft);">Curating the most beautiful home decor items across the web.</p>
        </div>
        <div>
          <h4 style="font-family:var(--font-serif); font-size:18px; margin-bottom:16px;">Links</h4>
          <ul style="list-style:none; padding:0; display:flex; flex-direction:column; gap:10px;">
            <li><a href="shop.html" style="color:#fff; text-decoration:none;">Shop</a></li>
            <li><a href="categories.html" style="color:#fff; text-decoration:none;">Categories</a></li>
            <li><a href="blog.html" style="color:#fff; text-decoration:none;">Blog</a></li>
            <li><a href="about.html" style="color:#fff; text-decoration:none;">About</a></li>
          </ul>
        </div>
      </div>
      <div class="foot-bottom" style="border-top:1px solid rgba(255,255,255,0.1); padding-top:20px; text-align:center; font-size:14px; color:var(--ink-soft);">
        &copy; 2026 Velvet FINDS. All rights reserved.
      </div>
    </div>
  </footer>

  <script src="data.js"></script>
  <script src="mascot.js"></script>
  <script>
    if(window.VF) VF.init();

    function formatDate(d) {
      return new Date(d).toLocaleDateString('en-IN', {day:'numeric',month:'long',year:'numeric'});
    }

    (async () => {
      const wrap = document.getElementById('articleWrap');
      const slug = new URLSearchParams(window.location.search).get('slug');

      if (!slug) {
        wrap.innerHTML = `<div style="text-align:center;padding:100px 20px;"><h2>Article not found</h2><a href="blog.html" class="btn-gold" style="margin-top:20px;display:inline-flex;">← Back to Blog</a></div>`;
        return;
      }

      wrap.innerHTML = `<div style="text-align:center;padding:100px 20px;"><div class="spinner" style="margin:0 auto 20px;"></div><p style="color:var(--ink-soft);">Loading article…</p></div>`;

      try {
        if (window.VF && VF.init) VF.init();
        const blog = await VF.getBlog(slug);
        if (!blog) {
          wrap.innerHTML = `<div style="text-align:center;padding:100px 20px;"><div style="font-size:64px;margin-bottom:20px;">📝</div><h2>Article not found</h2><p style="color:var(--ink-soft);margin:12px 0 28px;">This article may have been moved or deleted.</p><a href="blog.html" class="btn-gold" style="display:inline-flex;">← Back to Blog</a></div>`;
          return;
        }

        // SEO
        document.title = (blog.metaTitle || blog.title) + ' | Velvet FINDS';
        document.querySelector('meta[name="description"]')?.setAttribute('content', blog.metaDescription || blog.excerpt);
        document.getElementById('ogTitle')?.setAttribute('content', blog.metaTitle || blog.title);
        document.getElementById('ogDesc')?.setAttribute('content', blog.metaDescription || blog.excerpt);
      if (blog.coverImage) document.getElementById('ogImage')?.setAttribute('content', blog.coverImage);

      // Tags HTML
      const tagsHtml = (blog.tags||[]).map(t =>
        `<span style="display:inline-block;padding:4px 14px;border-radius:999px;border:1px solid var(--line);font-size:12px;font-weight:700;margin:3px;color:var(--ink-soft);">#${t}</span>`
      ).join('');

      wrap.innerHTML = `
        <div class="wrap">
          <div class="breadcrumb" style="margin:28px 0 20px; font-size:14px; color:var(--ink-soft);">
            <a href="index.html" style="color:var(--ink); text-decoration:none;">Home</a><span style="margin:0 8px;">›</span><a href="blog.html" style="color:var(--ink); text-decoration:none;">Blog</a><span style="margin:0 8px;">›</span><span>${blog.title}</span>
          </div>

          <div style="max-width:800px;">
            <span class="blog-cat-badge" style="position:static;display:inline-block;margin-bottom:18px;">${blog.category}</span>
            <h1 style="font-family:var(--font-serif);font-weight:450;font-size:clamp(28px,4.5vw,52px);line-height:1.15;margin-bottom:22px;color:var(--plum-900);">${blog.title}</h1>
            <div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap;font-size:13.5px;color:var(--ink-soft);margin-bottom:16px;">
              <span>✍️ ${blog.author || 'Velvet FINDS Team'}</span>
              <span>📅 ${formatDate(blog.publishDate)}</span>
              <span>⏱ ${blog.readTime || 5} min read</span>
            </div>
            <div style="margin-bottom:20px;">${tagsHtml}</div>
            <div style="display:flex;gap:10px;flex-wrap:wrap;padding-bottom:28px;border-bottom:1px solid var(--line);">
              <a href="https://pinterest.com/pin/create/button/?url=${encodeURIComponent(window.location.href)}&description=${encodeURIComponent(blog.title)}" target="_blank" style="display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--ink);text-decoration:none;transition:all .2s;">📌 Save to Pinterest</a>
              <button id="copyLinkBtn" onclick="navigator.clipboard.writeText(window.location.href);this.textContent='Copied ✓'" style="display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:700;background:transparent;cursor:pointer;transition:all .2s;color:var(--ink);">🔗 Copy Link</button>
            </div>
          </div>
        </div>

        ${blog.coverImage ? `<div style="max-width:1280px;margin:32px auto;padding:0 40px;"><img src="${blog.coverImage}" alt="${blog.title}" style="width:100%;max-height:500px;object-fit:cover;border-radius:20px;" loading="lazy"></div>` : ''}

        <div class="wrap">
          <div class="article-layout">
            <div class="article-main">
              <div id="articleContent" class="article-body">
                ${blog.content || ''}
                
                ${(blog.listicleItems && blog.listicleItems.length > 0) ? `
                  <div style="margin-top: 40px;">
                    ${blog.listicleItems.map((item, idx) => `
                      <div style="margin-bottom: 40px; padding-bottom: 30px; border-bottom: 1px solid var(--line);">
                        ${item.title ? `<h2 style="font-family:var(--font-serif); font-size:24px; color:var(--plum-900); margin-bottom:15px;">${item.title}</h2>` : ''}
                        ${item.img ? `<img src="${item.img}" alt="${item.title || 'Product'}" style="width:100%; border-radius:12px; margin-bottom:15px;">` : ''}
                        ${item.desc ? `<p style="font-size:15px; color:var(--ink); line-height:1.6; margin-bottom:15px;">${item.desc}</p>` : ''}
                        ${item.link ? `<a href="${item.link}" target="_blank" class="btn-gold" style="padding:10px 24px; font-size:14px; text-decoration:none; display:inline-block; border-radius:8px;">${item.btnText || 'Buy on Amazon'} →</a>` : ''}
                      </div>
                    `).join('')}
                  </div>
                ` : ''}
              </div>

              <section style="margin-top:60px;padding-top:50px;border-top:2px solid var(--line);">
                <h2 style="font-family:var(--font-serif);font-weight:450;font-size:28px;margin-bottom:8px;color:var(--ink);">🛍️ Shop The Look</h2>
                <p style="color:var(--ink-soft);font-size:14px;margin-bottom:28px;">Products we recommend from this article</p>
                <div id="recommendedProducts" class="rec-products-grid">Loading…</div>
              </section>
            </div>
            <aside class="article-toc" id="tocPanel"></aside>
          </div>

          <section style="margin-top:80px;padding-top:60px;border-top:1px solid var(--line);">
            <div style="text-align:center;margin-bottom:40px;">
              <span style="display:block;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--gold-500);font-weight:800;margin-bottom:10px;">More Reading</span>
              <h2 style="font-family:var(--font-serif);font-weight:450;font-size:clamp(24px,3vw,36px);color:var(--plum-900);">Related Articles</h2>
            </div>
            <div id="relatedArticles" class="blog-grid"></div>
            <div style="text-align:center;margin-top:36px;">
              <a href="blog.html" class="btn-gold">View All Articles →</a>
            </div>
          </section>
        </div>`;

      // Generate TOC
      const headings = document.querySelectorAll('#articleContent h2');
      const toc = document.getElementById('tocPanel');
      if (headings.length > 1 && toc) {
        let html = '<div class="toc-box"><div class="toc-title">📋 Table of Contents</div><ul class="toc-list">';
        headings.forEach((h, i) => { h.id = 'sec-'+i; html += `<li><a href="#sec-${i}" class="toc-link">${h.textContent}</a></li>`; });
        html += '</ul></div>';
        toc.innerHTML = html;
        const obs = new IntersectionObserver(entries => {
          entries.forEach(e => {
            if (e.isIntersecting) {
              document.querySelectorAll('.toc-link').forEach(l => l.classList.remove('toc-active'));
              const l = document.querySelector(`.toc-link[href="#${e.target.id}"]`);
              if (l) l.classList.add('toc-active');
            }
          });
        }, { rootMargin: '-20% 0px -70% 0px' });
        headings.forEach(h => obs.observe(h));
      }

      // Recommended products
      const prodEl = document.getElementById('recommendedProducts');
      if (prodEl) {
        const allP = await VF.getProducts();
        const cats = blog.recommendedProductCategories || [];
        let picks = allP.filter(p => cats.includes(p.category));
        if (picks.length < 4) picks = [...picks, ...allP.filter(p => !cats.includes(p.category))].slice(0, 4);
        picks = picks.slice(0, 4);
        if (picks.length) {
          prodEl.innerHTML = picks.map(p => `
            <div class="rec-product-card" onclick="window.location.href='product.html?id=${p.id}'">
              <div class="rec-product-img" style="${p.image ? `background-image:url('${p.image}');background-size:cover;background-position:center;` : `background:${p.gradient};`}"></div>
              <div class="rec-product-body">
                <div style="font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--gold-500);font-weight:800;margin-bottom:6px;">${p.category}</div>
                <div style="font-family:var(--font-serif);font-size:15px;font-weight:450;line-height:1.3;margin-bottom:8px;color:var(--ink);">${p.name}</div>
                <div style="font-size:16px;font-weight:800;margin-bottom:14px;color:var(--ink);">₹${p.price.toLocaleString()}</div>
                <a href="product.html?id=${p.id}" onclick="event.stopPropagation()" style="display:block;text-align:center;padding:10px;border-radius:999px;background:var(--gold-grad);color:var(--plum-900);font-weight:800;font-size:13px;text-decoration:none;">Shop Now →</a>
              </div>
            </div>`).join('');
        } else {
          prodEl.innerHTML = '<p style="color:var(--ink-soft);">No products to display.</p>';
        }
      }

      // Related articles
      const relEl = document.getElementById('relatedArticles');
      if (relEl) {
        const allB = await VF.getBlogs();
        const related = allB.filter(b => b.slug !== slug).slice(0, 3);
        relEl.innerHTML = related.map(b => `
          <article class="blog-card" onclick="window.location.href='article.html?slug=${b.slug}'">
            <div class="blog-card-img-wrap">
              <img src="${b.coverImage || 'https://images.unsplash.com/photo-1586023492125-27b2c045efd7?w=600&q=80'}" alt="${b.title}" loading="lazy">
              <span class="blog-cat-badge">${b.category}</span>
            </div>
            <div class="blog-card-body">
              <h2 class="blog-card-title" style="font-size:16px;">${b.title}</h2>
              <p class="blog-card-excerpt">${b.excerpt}</p>
              <div class="blog-card-meta"><span>⏱ ${b.readTime || 5} min</span><span>📅 ${formatDate(b.publishDate)}</span></div>
              <span class="blog-read-more">Read →</span>
            </div>
          </article>`).join('');
      }
      } catch(err) {
        console.error('[VF] Article loading error:', err);
        wrap.innerHTML = `<div style="text-align:center;padding:100px 20px;"><h2>Article temporarily unavailable</h2><p style="color:var(--ink-soft);margin:12px 0 24px;">Please check your connection and try again.</p><a href="blog.html" class="btn-gold" style="display:inline-flex;">← Back to Blog</a></div>`;
      }
    })();
  </script>
</body>
</html>
